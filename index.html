<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamba Chat</title>
  <meta name="description" content="A simple, accessible, interactive chat app.">
  <meta name="theme-color" content="#212121">
  <style>
    :root {
      --primary-bg: #212121;
      --secondary-bg: #323232;
      --accent-bg: #2c90e7;
      --accent-text: #fff;
      --input-bg: #262626;
      --input-text: #ededed;
      --chat-message-bg: #23282d;
      --chat-message-mine: #2c90e7;
      --chat-message-mine-text: #fff;
      --border-radius: 10px;
      --shadow: 0 5px 20px rgba(0,0,0,0.12);
    }
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: var(--primary-bg);
      color: var(--accent-text);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    main {
      background: var(--secondary-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      margin: 2rem auto 0 auto;
      padding: 1rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    h1 {
      font-size: 2rem;
      text-align: center;
      margin: 0.5rem 0 1rem 0;
      color: var(--accent-bg);
      letter-spacing: 2px;
    }
    #username-section {
      display: flex;
      flex-direction: row;
      gap: 0.7rem;
      justify-content: center;
      align-items: center;
    }
    #username {
      background: var(--input-bg);
      color: var(--input-text);
      border: none;
      border-radius: var(--border-radius);
      padding: 0.5rem 1rem;
      font-size: 1rem;
      width: 60%;
    }
    #set-username {
      background: var(--accent-bg);
      color: var(--accent-text);
      border: none;
      border-radius: var(--border-radius);
      font-size: 1rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #set-username:hover {
      background: #2074b6;
    }
    #chat-window {
      background: var(--chat-message-bg);
      border-radius: var(--border-radius);
      padding: 1rem 0.5rem;
      height: 22rem;
      overflow-y: auto;
      font-size: 1rem;
      border: 1px solid #262626;
      outline: none;
    }
    .chat-message {
      margin-bottom: 1rem;
      padding: 0.5rem 0.7rem;
      border-radius: var(--border-radius);
      background: var(--chat-message-bg);
      word-break: break-word;
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .chat-message.mine {
      background: var(--chat-message-mine);
      color: var(--chat-message-mine-text);
      align-self: flex-end;
      margin-left: auto;
      box-shadow: 0 2px 12px rgba(44,144,231,0.12);
    }
    .meta {
      font-size: 0.85em;
      color: #cfd8dc;
      margin-top: 0.2em;
      display: flex;
      justify-content: space-between;
    }
    #input-section {
      display: flex;
      gap: 0.7rem;
      align-items: center;
    }
    #message-input {
      flex: 1;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      border-radius: var(--border-radius);
      border: none;
      background: var(--input-bg);
      color: var(--input-text);
    }
    #send-btn {
      background: var(--accent-bg);
      color: var(--accent-text);
      border: none;
      border-radius: var(--border-radius);
      font-size: 1.1rem;
      padding: 0.65rem 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    @media (max-width: 500px) {
      main {
        max-width: 99vw;
        padding: 0.5rem;
      }
      #chat-window { height: 18rem; font-size: 0.98rem; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="chat_title">
    <h1 id="chat_title">Lamba Chat</h1>
    <section id="username-section" aria-label="User setup">
      <input id="username" type="text" placeholder="Enter your username" maxlength="20" aria-label="Username">
      <button id="set-username">Set</button>
    </section>
    <section id="chat-window" tabindex="0" aria-label="Chat window">
      <!-- Messages will appear here -->
    </section>
    <form id="input-section" aria-label="Message input" autocomplete="off">
      <input id="message-input" type="text" placeholder="Type your message..." maxlength="300" aria-label="Type your message" required>
      <button id="send-btn" type="submit" disabled>Send</button>
    </form>
  </main>
  <script>
    // Utility functions
    function timeString() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    function getUsername() {
      return localStorage.getItem('lamba_chat_username') || '';
    }
    function setUsername(name) {
      localStorage.setItem('lamba_chat_username', name || '');
    }
    function getMessages() {
      try {
        return JSON.parse(localStorage.getItem('lamba_chat_messages')) || [];
      } catch {
        return [];
      }
    }
    function saveMessages(msgs) {
      localStorage.setItem('lamba_chat_messages', JSON.stringify(msgs));
    }
    function sanitize(str) {
      return str.replace(/[<>&"]/g, c => ({
        '<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'
      }[c]));
    }

    // DOM elements
    const usernameInput = document.getElementById('username');
    const setUsernameBtn = document.getElementById('set-username');
    const chatWindow = document.getElementById('chat-window');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const inputSection = document.getElementById('input-section');
    let myUsername = '';

    // Username management
    function initUsername() {
      myUsername = getUsername();
      if (myUsername) {
        usernameInput.value = myUsername;
        usernameInput.disabled = true;
        setUsernameBtn.disabled = true;
        sendBtn.disabled = false;
        messageInput.placeholder = "Type your message...";
        messageInput.focus();
      } else {
        messageInput.placeholder = "Pick your username first...";
        sendBtn.disabled = true;
      }
    }
    setUsernameBtn.addEventListener('click', function(){
      const name = sanitize(usernameInput.value.trim());
      if (!name) {
        alert("Username required!");
        usernameInput.focus();
        return;
      }
      setUsername(name);
      initUsername();
    });
    usernameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !setUsernameBtn.disabled) {
        setUsernameBtn.click();
      }
    });

    // Chat display
    function renderMessages() {
      const messages = getMessages();
      chatWindow.innerHTML = '';
      messages.forEach(({user, text, time}) => {
        const msgDiv = document.createElement('div');
        msgDiv.className = "chat-message" + (user === myUsername ? " mine" : "");
        msgDiv.innerHTML = `<b>${sanitize(user)}</b>: ${sanitize(text)}
          <div class="meta">
            <span>${sanitize(time)}</span>
            <span>${user === myUsername ? "You" : ""}</span>
          </div>`;
        chatWindow.appendChild(msgDiv);
      });
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Message sending
    inputSection.addEventListener('submit', e => {
      e.preventDefault();
      if (!myUsername) return;
      const msgText = sanitize(messageInput.value.trim());
      if (!msgText) return;
      const messages = getMessages();
      messages.push({
        user: myUsername,
        text: msgText,
        time: timeString(),
      });
      saveMessages(messages);
      messageInput.value = "";
      renderMessages();
      chatWindow.scrollTop = chatWindow.scrollHeight;
    });

    // Accessibility: focus chat window after sending message!
    messageInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !sendBtn.disabled) {
        sendBtn.click();
      }
    });

    // Enable send button when user types
    messageInput.addEventListener('input', function() {
      sendBtn.disabled = !messageInput.value.trim() || !myUsername;
    });

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
      initUsername();
      renderMessages();
    });
  </script>
  <!-- 
    Lamba Chat | Single File
    - Modern responsive chat frontend
    - Local storage: messages persist per-device
    - Accessible UI, semantic markup
    - Easy to expand for real backend or AI features
    - MIT License (if you share)
  -->
</body>
</html>
